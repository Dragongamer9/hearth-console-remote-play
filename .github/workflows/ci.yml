# Hearth Console Remote Play (this repository; docs/CONSOLE-REMOTE-PLAY.md): a Hearth Store app.
# Built and tested only here, in Fedora 45 as Hearth OS, Fedora edition is (it can't reach a real Xbox: Microsoft's
# services are CI's stand-in, tests/fixtures/http.json):
#   build     cargo build --release and cargo test (the sign-in's signing and PKCE, the recorded answers, the
#             controller packets, settings and the monthly data), errors as annotations
#   run       every page on a headless screen (sway): the desktop pages at 1920 x 1080, the Ally's Game Mode pages at
#             1280 x 800, CPU at rest, opening writes nothing, no token in a log or a file
#   pictures  each picture as SHOT notices (one job each)
# Its version (1.0) is the owner's. Nothing is released from here.
name: Hearth Console Remote Play

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish this version (Cargo.toml) as a GitHub release with its AppImage, for the Hearth Store (only from main, only when the owner says push)'
        type: boolean
        default: false
      only:
        description: 'Only the pictures whose names match this (an extended regex); empty: all of them'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: console-remote-play-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: registry.fedoraproject.org/fedora:45
    steps:
      - name: Rust, the libraries iced uses, and GStreamer's
        run: |
          dnf -y install git tar zstd gcc pkgconf-pkg-config rust cargo libxkbcommon-devel wayland-devel fontconfig-devel freetype-devel python3 \
            gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-bad-free-devel >/dev/null
          echo "::notice title=toolchain::$(rustc --version) · $(cargo --version) · GStreamer $(pkg-config --modversion gstreamer-1.0) · webrtc $(pkg-config --modversion gstreamer-webrtc-1.0)"
      - uses: actions/checkout@v4
      - name: Hearth's shared look and widgets (hearth-ui), from Hearth OS at the commit in hearth-os.ref
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/Dragongamer9/hearth-os hearth-os
          git -C hearth-os sparse-checkout set --no-cone /hosts/hearth-ui/ /hosts/linux/desktop/theme/ /hosts/hearth-core/src/ /ui/osk/
          git -C hearth-os checkout -q "$(cat hearth-os.ref)"
          echo "::notice title=hearth-os::$(cat hearth-os.ref | cut -c1-9)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: crp-f45-${{ hashFiles('Cargo.toml', 'hearth-os.ref') }}-${{ github.sha }}
          restore-keys: crp-f45-${{ hashFiles('Cargo.toml', 'hearth-os.ref') }}-
      - name: Build
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log; then
            grep -E '^error' -A14 build.log | grep -v '^--$' | head -600 > errs.txt
            awk '/^error/{if (b) print b; b=$0; next} {b=b "|" $0} END{print b}' errs.txt | head -40 | while read -r l; do
              echo "::error title=cargo build::$(echo "$l" | cut -c1-3800)"
            done
            exit 1
          fi
          echo "::notice title=size::$(du -h target/release/hearth-console-remote-play | cut -f1)"
          grep -c '^warning' build.log | xargs -I{} echo "::notice title=warnings::{} warnings"
      - name: Tests
        run: |
          cargo test --release -- --test-threads=1 2>&1 | tee test.log || { grep -E "panicked|FAILED|^error" -A3 test.log | head -30 | while read -r l; do echo "::error title=cargo test::$l"; done; exit 1; }
          echo "::notice title=cargo test::$(grep -E '^test result' test.log | tr '\n' ' ' | cut -c1-500)"
      - name: Gather
        run: |
          mkdir -p bin
          cp target/release/hearth-console-remote-play bin/
          echo "::notice title=version::$(bin/hearth-console-remote-play --version | head -1)"
          cp helper/hearth-console-remote-play-signin bin/
      - uses: actions/upload-artifact@v4
        with:
          name: console-remote-play
          path: bin
          retention-days: 7

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: registry.fedoraproject.org/fedora:45
    outputs:
      shots: ${{ steps.list.outputs.shots }}
    steps:
      - name: A screen in memory (sway), grim, fonts, GStreamer, WebKitGTK
        run: |
          dnf -y install --skip-unavailable git sway grim procps-ng python3 python3-pillow util-linux shadow-utils libxkbcommon libwayland-client libwayland-cursor \
            mesa-vulkan-drivers vulkan-loader mesa-dri-drivers mesa-libEGL mesa-libgbm libglvnd-egl fontconfig rsms-inter-fonts google-noto-sans-fonts \
            google-noto-sans-symbols-fonts google-noto-sans-symbols-2-fonts dejavu-sans-fonts dejavu-sans-mono-fonts \
            gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good gstreamer1-plugins-bad-free \
            webkit2gtk4.1 gtk3 python3-gobject python3-cairo adwaita-icon-theme >/dev/null
          for b in sway grim swaymsg runuser; do command -v $b >/dev/null || echo "::warning title=setup::$b isn't installed"; done
          python3 -c 'import gi; gi.require_version("WebKit2", "4.1"); from gi.repository import WebKit2' || echo "::warning title=setup::no WebKitGTK for Python (the sign-in window)"
      - uses: actions/checkout@v4
      - name: Hearth's shared look and widgets (hearth-ui), from Hearth OS at the commit in hearth-os.ref
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/Dragongamer9/hearth-os hearth-os
          git -C hearth-os sparse-checkout set --no-cone /hosts/hearth-ui/ /hosts/linux/desktop/theme/ /hosts/hearth-core/src/ /ui/osk/
          git -C hearth-os checkout -q "$(cat hearth-os.ref)"
          echo "::notice title=hearth-os::$(cat hearth-os.ref | cut -c1-9)"
      - uses: actions/download-artifact@v4
        with:
          name: console-remote-play
          path: bin
      - name: Every page, measured and pictured
        timeout-minutes: 30
        run: |
          chmod +x bin/*
          HEARTH_SHOTS_ONLY="${{ inputs.only }}" bash .github/scripts/test.sh
      - name: The pictures taken
        id: list
        if: always()
        run: |
          ls shots/*.png 2>/dev/null | xargs -r -n1 basename | sed 's/\.png$//' > /tmp/shots.txt || true
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then grep -E "$ONLY" /tmp/shots.txt > /tmp/s2.txt || true; mv /tmp/s2.txt /tmp/shots.txt; fi
          echo "shots=$(python3 -c 'import json,sys; print(json.dumps([l.strip() for l in open(sys.argv[1]) if l.strip()][:200]))' /tmp/shots.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-remote-play-shots
          path: |
            shots
            results.txt
          retention-days: 14

  pictures:
    needs: run
    if: always() && needs.run.result != 'skipped' && needs.run.outputs.shots != '[]' && needs.run.outputs.shots != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot: ${{ fromJSON(needs.run.outputs.shots || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: console-remote-play-shots
          path: .
      - name: Picture ${{ matrix.shot }}
        run: |
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet pillow >/dev/null
          python3 .github/scripts/shot.py ${{ matrix.shot }}

  # The binary the AppImage carries, built on Debian 13 (Hearth OS's own edition, glibc 2.41): a build on Fedora 45 needs
  # glibc 2.43+ and won't start on Debian ("GLIBC_2.43 not found", the owner's Nvidia PC, Nov 25, 2026). Built on the
  # older glibc it starts on Debian and on Fedora alike. The tests run in the build job above.
  build-debian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: debian:trixie
    steps:
      - name: Rust, the libraries iced uses, and GStreamer's (Debian's)
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev python3 libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev >/dev/null
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "::notice title=debian::glibc $(ldd --version | head -1 | awk '{print $NF}') · GStreamer $(pkg-config --modversion gstreamer-1.0)"
      - uses: actions/checkout@v4
      - name: Hearth's shared look and widgets (hearth-ui), from Hearth OS at the commit in hearth-os.ref
        run: |
          git clone -q --filter=blob:none --no-checkout https://github.com/Dragongamer9/hearth-os hearth-os
          git -C hearth-os sparse-checkout set --no-cone /hosts/hearth-ui/ /hosts/linux/desktop/theme/ /hosts/hearth-core/src/ /ui/osk/
          git -C hearth-os checkout -q "$(cat hearth-os.ref)"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: console-remote-play-deb13-${{ hashFiles('Cargo.toml', 'hearth-os.ref') }}-${{ github.sha }}
          restore-keys: console-remote-play-deb13-${{ hashFiles('Cargo.toml', 'hearth-os.ref') }}-
      - name: Build
        run: |
          set -o pipefail
          if ! cargo build --release 2>&1 | tee build.log; then
            grep -E '^error' -A8 build.log | head -200 | tr '\n' '|' | fold -w 3800 | head -10 | while read -r l; do echo "::error title=cargo build (Debian)::$l"; done
            exit 1
          fi
      - name: Starts on Debian 13 (no newer glibc than 2.41 asked for)
        run: |
          mkdir -p bin
          cp target/release/hearth-console-remote-play bin/
          ls bin
          bad=0
          for f in bin/*; do
            need=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "::notice title=glibc::$(basename "$f") needs $need"
            if [ "$(printf '%s\n' "$need" GLIBC_2.41 | sort -V | tail -1)" != GLIBC_2.41 ]; then echo "::error title=glibc::$(basename "$f") needs $need, newer than Debian 13's 2.41"; bad=1; fi
          done
          [ $bad = 0 ] && cp helper/hearth-console-remote-play-signin bin/
          exit $bad
      - uses: actions/upload-artifact@v4
        with:
          name: console-remote-play-debian
          path: bin
          retention-days: 7

  # The AppImage the Hearth Store installs (and the owner can try by hand): on every run, kept 14 days on the run.
  appimage:
    needs: build-debian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: registry.fedoraproject.org/fedora:45
    steps:
      - run: dnf -y install git curl file >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: console-remote-play-debian
          path: bin
      - name: Make the AppImage
        run: chmod +x bin/* && bash .github/scripts/appimage.sh "hearth-console-remote-play" "Hearth Console Remote Play" "RP" "#34d399" "#047857" bin/hearth-console-remote-play-signin
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: dist
          retention-days: 14

  # A release (the Hearth Store's download): only by hand with "release" ticked, only from main, only after the build,
  # the tests and every page ran. The tag is the version in Cargo.toml (the owner's number); an existing tag is refused.
  release:
    needs: [appimage, run]
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AppImage
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if gh release view "v$v" >/dev/null 2>&1; then echo "::error title=release::v$v is already released"; exit 1; fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "v$v" dist/*.AppImage dist/SHA256SUMS.txt --title "$(sed -n 's/^description = "\(.*\)"/\1/p' Cargo.toml | cut -d: -f1) $v" --notes-file release-notes/v$v.md --target "$GITHUB_SHA"
          echo "::notice title=release::v$v published"
